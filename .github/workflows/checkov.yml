name: Checkov
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Test with Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: /
          framework: terraform
      - name: Create GitHub Issue on Failure
        if: failure() && steps.checkov.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com{context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueTitle = `Checkov - Security Misconfiguration Detected`;
            const issueBody = `Checkov discovered policy violations in the latest workflow run.\n\n### 🔗 Action Required\nReview the failed security logs here: [View Workflow Run](${runUrl})\n\n_Automated report generated by GitHub Actions._`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['security', 'bug']
            });